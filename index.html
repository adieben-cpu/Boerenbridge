<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Boerenbridge scorebord</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172b29;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:16px 14px 90px}h1{font-size:26px;margin:8px 0 4px}h2{font-size:20px;margin:8px 0 16px}.muted{color:#657572}.card{background:white;border:1px solid #dce6e1;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #163e2910}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:grid;gap:12px}input,select{font:inherit;padding:12px;border:1px solid #bacdc3;border-radius:10px;background:white;min-width:0;width:100%}input[type=number]{width:78px;text-align:center}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:12px 15px;font-weight:650;background:#0b735c;color:white}button:disabled{opacity:.35;cursor:not-allowed}.secondary{background:#e7f0ec;color:#175d4d}.danger{background:#fbe9e9;color:#a12626}.small{padding:8px 12px}.counter{display:flex;align-items:center;gap:7px}.counter button{min-width:39px;padding:9px}.counter span{min-width:25px;text-align:center;font-weight:700}.pill{display:inline-block;background:#e6f2ed;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:700;color:#14614f}.warning{color:#a34319}.good{color:#0c795a}.error{color:#b22525}.wide{width:100%}.player{display:grid;grid-template-columns:minmax(90px,1fr) auto;gap:10px;align-items:center;border-top:1px solid #e5ece8;padding:12px 0}.player:first-child{border:0}.tiny{font-size:13px}.score{font-size:26px;font-weight:800}.leader{background:#f0f8f3}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.nav>*{flex:1}.suits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.suit{font-size:29px;background:#edf1ef;color:#1a2925}.suit.selected{outline:3px solid #0b735c;background:#d8f1e6}.red{color:#bc3038}.progress{font-size:14px;color:#657572}.center{text-align:center}.tag{font-size:12px;background:#eef1ef;padding:4px 7px;border-radius:8px}.rank{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid #e3e9e5}.rank:last-child{border:0}.footer{margin-top:25px;text-align:center;font-size:12px;color:#657572}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px}.hide{display:none}.history{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #e1e9e5;padding:9px;text-align:center}td:first-child,th:first-child{text-align:left}button:focus-visible,input:focus-visible{outline:3px solid #8ad4b3}
</style><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#145c46"><link rel="apple-touch-icon" href="./icon-192.png"></head><body><main id="app"></main><script>
const KEY='boerenbridge_v1';let state;const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const maxCards=n=>Math.floor(51/n);const seq=m=>[...Array.from({length:m},(_,i)=>i+1),...Array.from({length:m-1},(_,i)=>m-i-1)];const points=(b,w)=>b===w?w+1:-Math.abs(b-w);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function fresh(){return {page:'setup',count:4,names:['Speler 1','Speler 2','Speler 3','Speler 4','Speler 5','Speler 6','Speler 7','Speler 8'],max:8,round:0,phase:'bid',dealer:0,records:[],bids:[],wins:[],suit:'',editing:false}}try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()}function update(fn){fn();save();render()}function header(sub=''){return `<div class="toolbar"><div><h1>♠ Boerenbridge</h1><div class="muted tiny">${sub}</div></div><span class="pill">♥ ♦ ♣ ♠</span></div>`}function counter(i,type,v,max){return `<div class="counter"><button class="secondary" onclick="change('${type}',${i},-1)" ${v<=0?'disabled':''}>−</button><span>${v===null?'–':v}</span><button class="secondary" onclick="change('${type}',${i},1)" ${v>=max?'disabled':''}>+</button></div>`}function render(){let html='';if(state.page==='setup'){const limit=maxCards(state.count);state.max=Math.min(state.max,limit);html=header('Nieuw spel instellen')+`<section class="card stack"><div class="row"><strong>Aantal spelers</strong>${counter(0,'count',state.count,8)}</div><div><strong>Spelers op zitvolgorde</strong><div class="stack" style="margin-top:12px">${state.names.slice(0,state.count).map((name,i)=>`<div class="row"><span class="tag">${i+1}</span><input aria-label="Naam speler ${i+1}" maxlength="30" value="${esc(name)}" oninput="rename(${i},this.value)"></div>`).join('')}</div></div><div class="row"><strong>Hoogste aantal kaarten</strong>${counter(0,'max',state.max,limit)}</div><div class="muted tiny">Maximaal ${limit} kaarten per speler: één van de 52 kaarten blijft over om de troef te bepalen.</div><div class="row"><span>Rondes</span><strong>1 → ${state.max} → 1 (${2*state.max-1} rondes)</strong></div><label>Wie deelt de eerste ronde?<select id="firstDealer">${state.names.slice(0,state.count).map((n,i)=>`<option value="${i}" ${state.dealer===i?'selected':''}>${esc(n)}</option>`).join('')}</select></label><button onclick="start()" class="wide">Start spel →</button></section>`}else{const rounds=seq(state.max),total=rounds.length,hand=rounds[state.round],dealer=(state.dealer+state.round)%state.count,first=(dealer+1)%state.count;html=header(`Ronde ${state.round+1} van ${total}`)+`<div class="card"><div class="row"><div><div class="muted tiny">Kaarten per speler</div><div class="score">${hand}</div></div><div class="center"><div class="muted tiny">Deler</div><strong>${esc(state.names[dealer])}</strong></div></div><div class="muted tiny" style="margin-top:10px">Eerste bieder: ${esc(state.names[first])}</div></div>`;if(state.page==='play'){if(state.phase==='bid'){let order=Array.from({length:state.count},(_,i)=>(first+i)%state.count),last=order.at(-1),prior=order.slice(0,-1).reduce((s,i)=>s+(state.bids[i]??0),0),all=state.bids.every(x=>x!==null),sum=state.bids.reduce((s,x)=>s+(x??0),0),forbidden=hand-prior;html+=`<section class="card"><h2>1. Voorspellingen</h2><div class="muted tiny">Biedvolgorde (de deler biedt als laatste)</div>${order.map((i,k)=>`<div class="player"><div><strong>${esc(state.names[i])}</strong>${k===order.length-1?'<div class="tiny muted">Laatste bieder</div>':''}</div>${counter(i,'bid',state.bids[i],hand)}</div>`).join('')}<div class="card ${all&&sum===hand?'danger':'leader'}"><strong>Totaal geboden: ${sum} / ${hand}</strong><div class="${sum>hand?'warning':'muted'}">${sum>hand?sum-hand+' overgeboden':sum<hand?hand-sum+' ondergeboden':'Precies gelijk geboden'}</div>${state.bids[last]===null?`<div class="tiny">${forbidden>=0&&forbidden<=hand?`De laatste speler mag geen ${forbidden} bieden.`:'Iedere geldige voorspelling van de laatste speler is toegestaan.'}</div>`:''}${all&&sum===hand?'<div class="error">Ongeldig: de totale voorspelling mag niet gelijk zijn aan het aantal slagen.</div>':''}</div><button class="wide" ${!all||sum===hand?'disabled':''} onclick="toSuit()">Voorspellingen bevestigen →</button></section>`}else if(state.phase==='suit'){html+=`<section class="card"><h2>2. Troefkaart</h2><p class="muted">Draai de overgebleven kaart om en kies de kleur.</p><div class="suits">${[['♥','Harten'],['♦','Ruiten'],['♣','Klaveren'],['♠','Schoppen']].map(([s,t])=>`<button aria-label="${t}" class="suit ${'♥♦'.includes(s)?'red':''} ${state.suit===s?'selected':''}" onclick="pickSuit('${s}')">${s}</button>`).join('')}</div><div class="nav"><button class="secondary" onclick="backBid()">← Terug</button><button ${!state.suit?'disabled':''} onclick="toWins()">Slagen invoeren →</button></div></section>`}else{let sum=state.wins.reduce((a,b)=>a+(b??0),0),complete=state.wins.every(x=>x!==null);html+=`<section class="card"><div class="row"><h2>3. Behaalde slagen</h2><span class="pill">Troef ${state.suit}</span></div>${state.names.slice(0,state.count).map((n,i)=>`<div class="player"><div><strong>${esc(n)}</strong><div class="muted tiny">Geboden: ${state.bids[i]} ${state.wins[i]!==null?' · '+(points(state.bids[i],state.wins[i])>0?'+':'')+points(state.bids[i],state.wins[i])+' pt':''}</div></div>${counter(i,'win',state.wins[i],hand)}</div>`).join('')}<div class="card ${complete&&sum!==hand?'danger':'leader'}"><strong>Slagen ingevoerd: ${sum} / ${hand}</strong>${complete&&sum!==hand?'<div class="error">Het totaal moet precies gelijk zijn aan het aantal slagen.</div>':''}</div><div class="nav"><button class="secondary" onclick="backSuit()">← Terug</button><button ${!complete||sum!==hand?'disabled':''} onclick="finishRound()">Ronde afronden →</button></div></section>`}}else{let totals=state.names.slice(0,state.count).map((name,i)=>({name,i,score:state.records.reduce((s,r)=>s+points(r.bids[i],r.wins[i]),0)})).sort((a,b)=>b.score-a.score);html+=`<section class="card"><h2>${state.page==='done'?'🏆 Eindklassement':'Tussenstand'}</h2>${totals.map((p,i)=>`<div class="rank ${i===0?'leader':''}"><strong>${i+1}.</strong><span>${esc(p.name)}</span><span class="score">${p.score}</span></div>`).join('')}<div class="nav">${state.page==='summary'?`<button onclick="nextRound()" class="wide">Volgende ronde →</button>`:''}<button class="secondary" onclick="showHistory()">Rondes bekijken / corrigeren</button></div></section>`}html+=`<div class="nav"><button class="secondary" onclick="showScores()">Klassement</button><button class="secondary" onclick="showHistory()">Geschiedenis</button></div><div class="card"><button class="danger wide" onclick="resetGame()">Nieuw spel starten</button></div>`}if(state.page==='history'){html=header('Gespeelde rondes')+`<section class="card"><h2>Rondegeschiedenis</h2><div class="history"><table><tr><th>Ronde</th><th>Kaarten</th><th>Troef</th><th>Actie</th></tr>${state.records.map((r,i)=>`<tr><td>${i+1}</td><td>${r.hand}</td><td>${r.suit}</td><td><button class="small secondary" onclick="editRound(${i})">Corrigeer</button></td></tr>`).join('')}</table></div><button class="wide secondary" onclick="returnFromHistory()">← Terug</button></section>`}if(state.page==='edit'){let r=state.records[state.editIndex],sum=r.wins.reduce((a,b)=>a+(b??0),0),bidSum=r.bids.reduce((a,b)=>a+(b??0),0);html=header(`Ronde ${state.editIndex+1} corrigeren`)+`<section class="card"><h2>${r.hand} kaarten</h2><label>Troef<select onchange="editSuit(this.value)">${['♥','♦','♣','♠'].map(s=>`<option ${r.suit===s?'selected':''}>${s}</option>`).join('')}</select></label>${state.names.slice(0,state.count).map((n,i)=>`<div class="player"><div><strong>${esc(n)}</strong><div class="tiny muted">Voorspeld ${r.bids[i]} · Behaald ${r.wins[i]}</div></div><div class="stack"><div class="tiny">Bod ${counter(i,'editbid',r.bids[i],r.hand)}</div><div class="tiny">Slagen ${counter(i,'editwin',r.wins[i],r.hand)}</div></div></div>`).join('')}<div class="muted">Biedingen: ${bidSum}/${r.hand} · Behaalde slagen: ${sum}/${r.hand}</div><div class="nav"><button class="secondary" onclick="cancelEdit()">Annuleren</button><button ${sum!==r.hand||bidSum===r.hand?'disabled':''} onclick="saveEdit()">Correctie bewaren</button></div></section>`}html+='<div class="footer">Werkt offline · Spel wordt automatisch opgeslagen op dit apparaat</div>';$('app').innerHTML=html}
function change(type,i,delta){update(()=>{if(type==='count'){state.count=Math.max(2,Math.min(8,state.count+delta));state.max=Math.min(state.max,maxCards(state.count))}else if(type==='max')state.max=Math.max(1,Math.min(maxCards(state.count),state.max+delta));else{let arr=type==='bid'?state.bids:type==='win'?state.wins:type==='editbid'?state.records[state.editIndex].bids:state.records[state.editIndex].wins;let hand=type.startsWith('edit')?state.records[state.editIndex].hand:seq(state.max)[state.round];arr[i]=Math.max(0,Math.min(hand,(arr[i]??(delta>0?-1:1))+delta))}})}function rename(i,v){state.names[i]=v;save()}function start(){update(()=>{state.names=state.names.map((n,i)=>n.trim()||`Speler ${i+1}`);state.dealer=Number($('firstDealer').value);state.round=0;state.records=[];state.bids=Array(state.count).fill(null);state.wins=Array(state.count).fill(null);state.suit='';state.phase='bid';state.page='play'})}function toSuit(){update(()=>state.phase='suit')}function backBid(){update(()=>state.phase='bid')}function pickSuit(s){update(()=>state.suit=s)}function toWins(){update(()=>state.phase='win')}function backSuit(){update(()=>state.phase='suit')}function finishRound(){update(()=>{state.records.push({hand:seq(state.max)[state.round],bids:[...state.bids],wins:[...state.wins],suit:state.suit});state.page=state.round===seq(state.max).length-1?'done':'summary'})}function nextRound(){update(()=>{state.round++;state.phase='bid';state.page='play';state.bids=Array(state.count).fill(null);state.wins=Array(state.count).fill(null);state.suit=''})}function showScores(){update(()=>{if(state.page!=='summary'&&state.page!=='done')state.returnPage=state.page;state.page=state.records.length===seq(state.max).length?'done':'summary'})}function showHistory(){update(()=>{state.returnPage=state.page;state.page='history'})}function returnFromHistory(){update(()=>state.page=state.returnPage||'summary')}function editRound(i){update(()=>{state.editIndex=i;state.backup=JSON.parse(JSON.stringify(state.records[i]));state.page='edit'})}function editSuit(s){update(()=>state.records[state.editIndex].suit=s)}function cancelEdit(){update(()=>{state.records[state.editIndex]=state.backup;state.page='history'})}function saveEdit(){update(()=>{delete state.backup;state.page='history'})}function resetGame(){if(confirm('Een nieuw spel beginnen? De huidige score wordt gewist.'))update(()=>{state=fresh()})}render();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
